[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "normalize-uk"
version = "0.4.7"
description = "Python bindings for Ukrainian text normalization and tokenization utilities"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["Ukrainian", "text normalization", "tokenization", "text-to-speech"]
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: Ukrainian",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: C++",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/ThirdLetterC/normalize_uk-cpp"
Repository = "https://github.com/ThirdLetterC/normalize_uk-cpp"
Issues = "https://github.com/ThirdLetterC/normalize_uk-cpp/issues"
Changelog = "https://github.com/ThirdLetterC/normalize_uk-cpp/blob/main/CHANGELOG.md"

[tool.scikit-build]
minimum-version = "build-system.requires"
install.components = ["python"]
cmake.version = ">=3.20"
cmake.args = [
    "-DNORMALIZE_UK_CPP_BUILD_PYTHON=ON",
    "-DNORMALIZE_UK_CPP_BUILD_TESTS=OFF",
    "-DNORMALIZE_UK_CPP_BUILD_TOOLS=OFF",
    "-DNORMALIZE_UK_CPP_FETCH_PYBIND11=OFF",
]
wheel.packages = []

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["bindings/python", "cmake/gen_lexicon.py", "examples/python", "tests/python_binding_tests.py"]
extraPaths = ["bindings/python"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingModuleSource = "none"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.7",
]
